<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Book Flight</h2>

<form th:action="@{/bookings}" th:object="${booking}" method="post">
    <input type="hidden" th:field="*{flightId}">
    <label>Your Name: <input type="text" th:field="*{customerName}" required></label><br>
    <label>Your Phone: <input type="text" th:field="*{customerPhone}" required></label><br>
    <button type="submit">Confirm Booking</button>
</form>

</body>
</html>
