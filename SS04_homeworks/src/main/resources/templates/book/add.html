<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Book</title>
</head>
<body>
<h2>Add New Book</h2>

<form th:action="@{/books/add}" th:object="${book}" method="post">
  <label>Title: <input type="text" th:field="*{title}" required></label><br>
  <label>Author: <input type="text" th:field="*{author}" required></label><br>
  <label>Publisher: <input type="text" th:field="*{publisher}" required></label><br>
  <label>Year: <input type="number" th:field="*{year}" required></label><br>

  <button type="submit">Save</button>
</form>

<a th:href="@{/books}">Back to List</a>
</body>
</html>
