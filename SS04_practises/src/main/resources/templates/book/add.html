<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>

<h3>Add Book</h3>
<form th:action="@{'/categories/detail/' + ${cateId} + '/add'}" th:object="${book}" method="post">
    <input type="hidden" th:field="*{categoryId}" th:value="${cateId}"/>

    <p>Name: <input type="text" th:field="*{name}"/></p>
    <p>Author: <input type="text" th:field="*{author}"/></p>
    <p>Publisher: <input type="text" th:field="*{publisher}"/></p>
    <p>Public Year: <input type="date" th:field="*{publicYear}"/></p>
    <p>Price: <input type="number" step="0.01" th:field="*{price}"/></p>

    <button type="submit">Save</button>
    <a th:href="@{'/categories/detail/' + ${cateId}}">Back</a>
</form>

</body>
</html>
