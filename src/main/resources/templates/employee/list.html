<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Employee List</title>
</head>
<body>
<h1>Employee List</h1>
<a th:href="@{/employees/add}">add new</a>
<!-- Hiển thị bảng employees -->
<table border="1">
  <thead>
  <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Salary</th>
    <th>actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:if="${employees.isEmpty()}">
    <td colspan="4">No employees found.</td>
  </tr>
  <tr th:each="emp : ${employees}">
    <td th:text="${emp.name}">Name</td>
    <td th:text="${emp.email}">Email</td>
    <td th:text="${emp.phone}">Phone</td>
    <td th:text="${emp.salary}">Salary</td>
    <td>
      <a th:href="@{/employees/edit/{id}(id=${emp.id})}" style="color: green">edit</a>
      <a  th:href="@{/employees/delete/{id}(id=${emp.id})}" style="color: red">delete</a>
    </td>
  </tr>
  </tbody>
</table>


<div>
  <span th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}"></span>
</div>

<div>
  <ul>
    <li th:if="${currentPage > 1}">
      <a th:href="@{/employees(page=${currentPage - 1},size=${size})}">Previous</a>
    </li>
    <li th:if="${hasNext}">
      <a th:href="@{/employees(page=${currentPage + 1},size=${size})}">Next</a>
    </li>
  </ul>
</div>

</body>
</html>
