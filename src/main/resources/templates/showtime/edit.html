<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sửa lịch chiếu</title>
  <meta charset="UTF-8">
</head>
<body>
<h1>Sửa lịch chiếu</h1>

<form th:action="@{/showtimes/edit/{id}(id=${showtime.id})}" method="post">
  <label>Phim:</label>
  <select name="movie.id" required>
    <option th:each="movie : ${movies}"
            th:value="${movie.id}"
            th:selected="${movie.id == showtime.movie.id}"
            th:text="${movie.title}"></option>
  </select><br>

  <label>Phòng chiếu:</label>
  <select name="screenRoom.id" required>
    <option th:each="room : ${screenRooms}"
            th:value="${room.id}"
            th:selected="${room.id == showtime.screenRoom.id}"
            th:text="${room.name}"></option>
  </select><br>

  <label>Thời gian bắt đầu:</label>
  <input type="datetime-local" name="startTime"
         th:value="${#dates.format(showtime.startTime, 'yyyy-MM-dd\'T\'HH:mm')}" required><br>

  <label>Thời gian kết thúc:</label>
  <input type="datetime-local" name="endTime"
         th:value="${#dates.format(showtime.endTime, 'yyyy-MM-dd\'T\'HH:mm')}" required><br>

  <label>Số ghế trống:</label>
  <input type="number" name="numberSeatEmpty" th:value="${showtime.numberSeatEmpty}" required><br>

  <button type="submit">Cập nhật</button>
</form>

<a th:href="@{/showtimes}">Quay lại danh sách</a>

</body>
</html>
